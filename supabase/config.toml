# Configuration locale de la CLI Supabase (`supabase start`, `supabase db push`).
# Les secrets (clés Google/Apple, SMTP) viennent de variables d'environnement,
# jamais de ce fichier.
project_id = "djanguibook"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "1MiB"

[auth]
enabled = true
site_url = "https://djanguibook.pages.dev"
additional_redirect_urls = ["djanguibook://login-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# SMTP externe gratuit (ex. Brevo, 300 e-mails/jour) : l'envoi intégré de
# Supabase est limité à quelques messages par heure.
# [auth.email.smtp]
# enabled = true
# host = "smtp-relay.brevo.com"
# port = 587
# user = "env(SMTP_USER)"
# pass = "env(SMTP_PASS)"
# admin_email = "no-reply@djanguibook.app"
# sender_name = "DjanguiBook"

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_WEB_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = true

[auth.external.apple]
enabled = false
client_id = "env(APPLE_SERVICES_ID)"
secret = "env(APPLE_CLIENT_SECRET)"
